<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Weather Pro</title>
  <link rel="stylesheet" href="weather.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="weather-card">
    <div class="search-wrapper">
      <div class="search-box">
        <button class="geo-btn" id="geoBtn" title="Use Current Location">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
        <input type="text" id="cityInput" placeholder="Search city or location..." autocomplete="off">
        <button class="search-btn" id="searchBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
      <div class="suggestions" id="suggestions"></div>
    </div>

    <div id="weatherContent">
      <div class="header">
        <div>
          <div class="city-name" id="cityName">Loading...</div>
          <div class="date-time" id="dateTime">--</div>
        </div>
      </div>

      <div class="temp-section">
        <img id="weatherIcon" class="weather-icon" src="https://openweathermap.org/img/wn/03d@2x.png" alt="Condition">
        <div class="temp-display">
          <span id="tempValue">--</span>
          <div class="unit-toggle">
            <span id="unitC" class="active">°C</span>|
            <span id="unitF">°F</span>
          </div>
        </div>
        <div>
          <div class="condition-desc" id="conditionText">--</div>
        </div>
      </div>

      <div class="tabs">
        <div class="tab active" data-metric="temp">Temperature</div>
        <div class="tab" data-metric="precip">Precipitation (%)</div>
        <div class="tab" data-metric="wind">Wind (km/h)</div>
      </div>

      <div class="chart-container">
        <canvas id="hourlyChart"></canvas>
      </div>

      <div class="details-grid">
        <div class="detail-item">
          <span class="detail-label">Precipitation</span>
          <span class="detail-value" id="precipValue">--</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Humidity</span>
          <span class="detail-value" id="humidityValue">--</span>
        </div>
        <div class="detail-item">
          <span class="detail-label">Wind</span>
          <span class="detail-value" id="windValue">--</span>
        </div>
      </div>

      <div class="forecast-title">7-Day Forecast</div>
      <div class="forecast-row" id="forecastRow"></div>
    </div>
  </div>

  <script src="weather.js"></script>
</body>
</html>
